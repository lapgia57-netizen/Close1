<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Web3 Accounts, Domains & Digital Goods Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, TwitterAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    window.firebaseModules = { 
      initializeApp, getDatabase, ref, onValue, push, set, update, remove, serverTimestamp,
      getAuth, signInWithPopup, GoogleAuthProvider, TwitterAuthProvider, signOut, onAuthStateChanged 
    };
  </script>
  <style>
    .skeleton { background: linear-gradient(90deg, #2d3748 25%, #4a5568 50%, #2d3748 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    #postModal, #detailModal, #editModal, #loginModal { transition: opacity 0.3s ease; }
    .filter-active { background-color: #7c3aed !important; color: white !important; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-bold text-purple-400">Web3 & Digital Goods Market</h1>
      
      <div class="flex items-center gap-3 flex-wrap">
        <!-- Auth User Info -->
        <div id="userInfo" class="flex items-center gap-2 hidden bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">
          <img id="userAvatar" src="" class="w-6 h-6 rounded-full" alt="avatar">
          <span id="userName" class="text-sm font-medium text-gray-200"></span>
        </div>

        <!-- Wallet Info -->
        <span id="userAddress" class="text-xs bg-purple-950 text-purple-300 border border-purple-800 px-3 py-1.5 rounded-lg hidden font-mono"></span>

        <!-- Auth Buttons -->
        <button id="loginBtn" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg font-medium transition text-sm">Login (GG / X)</button>
        <button id="connectBtn" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg font-medium transition text-sm">Connect Wallet</button>
        <button id="postBtn" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg font-medium transition text-sm hidden">Post Item</button>
        <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-medium transition text-sm hidden">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <!-- Search & Filters -->
    <div class="flex flex-col sm:flex-row gap-4 mb-8">
      <div class="relative flex-1">
        <input id="searchInput" type="text" placeholder="Search accounts, domains, keys, software..." class="w-full bg-gray-800 rounded-full px-5 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm">
        <button id="searchBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-400">🔍</button>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="filterAll" class="px-4 py-2 bg-gray-800 rounded-full text-xs font-medium hover:bg-gray-700 filter-active">All</button>
        <button id="filterAccount" class="px-4 py-2 bg-gray-800 rounded-full text-xs font-medium hover:bg-gray-700">Accounts</button>
        <button id="filterDomain" class="px-4 py-2 bg-gray-800 rounded-full text-xs font-medium hover:bg-gray-700">Domains</button>
        <button id="filterOther" class="px-4 py-2 bg-gray-800 rounded-full text-xs font-medium hover:bg-gray-700">Other Goods</button>
        <button id="sortNewest" class="px-4 py-2 bg-gray-800 rounded-full text-xs font-medium hover:bg-gray-700 filter-active">Newest</button>
        <button id="sortPriceAsc" class="px-4 py-2 bg-gray-800 rounded-full text-xs font-medium hover:bg-gray-700">Price: Low</button>
        <button id="sortPriceDesc" class="px-4 py-2 bg-gray-800 rounded-full text-xs font-medium hover:bg-gray-700">Price: High</button>
      </div>
    </div>

    <!-- Marketplace -->
    <div id="marketplace" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 min-h-[400px]"></div>

    <!-- States -->
    <div id="loadingState" class="text-center py-20 text-gray-400 hidden">Loading listings...</div>
    <div id="emptyState" class="text-center py-20 text-gray-400 hidden">No listings available</div>
    <div id="notConnected" class="text-center py-12 text-gray-400">
      <p>Log in with Google/X or connect Web3 wallet to list your digital items.</p>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-800 rounded-xl p-8 w-full max-w-sm mx-4 text-center">
      <h2 class="text-xl font-bold mb-6 text-purple-400">Sign In to Marketplace</h2>
      <div class="space-y-4">
        <button id="loginGoogleBtn" class="w-full flex items-center justify-center gap-3 bg-white text-gray-900 font-medium py-2.5 px-4 rounded-lg hover:bg-gray-100 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>
        <button id="loginTwitterBtn" class="w-full flex items-center justify-center gap-3 bg-black text-white font-medium py-2.5 px-4 rounded-lg hover:bg-gray-900 border border-gray-700 transition">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          Continue with X (Twitter)
        </button>
      </div>
      <button id="closeLoginModal" class="mt-6 text-xs text-gray-400 hover:text-white">Cancel</button>
    </div>
  </div>

  <!-- Post Modal -->
  <div id="postModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-800 rounded-xl p-8 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
      <h2 class="text-2xl font-bold mb-6 text-purple-400">Create New Listing</h2>
      <form id="postForm">
        <div class="mb-4">
          <label class="block text-sm mb-1">Title</label>
          <input type="text" id="title" required placeholder="e.g. Premium X Account 10k Followers / Vitalik.eth" class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm mb-1">Category</label>
            <select id="type" class="w-full bg-gray-700 rounded-lg px-4 py-2">
              <option value="account">Social/Game Account</option>
              <option value="domain">Web3 Domain (ENS/Unstoppable)</option>
              <option value="other">Software Key / Digital Goods</option>
            </select>
          </div>
          <div>
            <label class="block text-sm mb-1">Blockchain Network</label>
            <select id="chain" class="w-full bg-gray-700 rounded-lg px-4 py-2">
              <option value="ethereum">Ethereum</option>
              <option value="solana">Solana</option>
              <option value="base">Base</option>
              <option value="other">Other / Off-chain</option>
            </select>
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-sm mb-1">Price (ETH)</label>
          <input type="number" step="0.0001" min="0.0001" id="price" required placeholder="0.05" class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div class="mb-4">
          <label class="block text-sm mb-1">Description & Delivery Details</label>
          <textarea id="description" rows="3" placeholder="Describe the item, stats, verification steps..." class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
        </div>
        <div class="mb-6">
          <label class="block text-sm mb-1">Seller Contact Info (Telegram / Discord / Email)</label>
          <input type="text" id="contact" required placeholder="@telegram_username or email@example.com" class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div class="flex justify-end gap-4">
          <button type="button" id="closePostModal" class="px-6 py-2 bg-gray-600 rounded-lg hover:bg-gray-500">Cancel</button>
          <button type="submit" class="px-6 py-2 bg-purple-600 rounded-lg hover:bg-purple-700">Post Listing</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-800 rounded-xl p-8 w-full max-w-lg mx-4">
      <h2 id="detailTitle" class="text-2xl font-bold mb-2 text-purple-400"></h2>
      <div class="flex gap-2 mb-4">
        <span id="detailType" class="text-xs bg-gray-700 px-2 py-1 rounded"></span>
        <span id="detailChain" class="text-xs bg-blue-900 text-blue-300 px-2 py-1 rounded"></span>
      </div>
      <p id="detailDescription" class="text-gray-300 mb-4 whitespace-pre-line"></p>
      <div class="bg-gray-900 p-4 rounded-lg mb-6">
        <p id="detailPrice" class="text-2xl font-bold text-green-400 mb-1"></p>
        <p id="detailContact" class="text-sm text-yellow-400 font-mono"></p>
      </div>
      <p id="detailSeller" class="text-xs text-gray-500 mb-1"></p>
      <p id="detailTime" class="text-xs text-gray-500 mb-6"></p>
      
      <div class="flex justify-end gap-3">
        <button id="closeDetailModal" class="px-5 py-2 bg-gray-600 rounded-lg hover:bg-gray-500 text-sm">Close</button>
        <button id="buyBtn" class="px-5 py-2 bg-purple-600 rounded-lg hover:bg-purple-700 text-sm">Pay with Web3 Wallet</button>
        <button id="editBtn" class="px-5 py-2 bg-blue-600 rounded-lg hover:bg-blue-700 text-sm hidden">Edit</button>
        <button id="deleteBtn" class="px-5 py-2 bg-red-600 rounded-lg hover:bg-red-700 text-sm hidden">Delete</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-800 rounded-xl p-8 w-full max-w-lg mx-4">
      <h2 class="text-2xl font-bold mb-6 text-purple-400">Edit Listing</h2>
      <form id="editForm">
        <input type="hidden" id="editId">
        <div class="mb-4">
          <label class="block text-sm mb-1">Title</label>
          <input type="text" id="editTitle" required class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm mb-1">Category</label>
            <select id="editType" class="w-full bg-gray-700 rounded-lg px-4 py-2">
              <option value="account">Account</option>
              <option value="domain">Domain</option>
              <option value="other">Other Goods</option>
            </select>
          </div>
          <div>
            <label class="block text-sm mb-1">Chain</label>
            <select id="editChain" class="w-full bg-gray-700 rounded-lg px-4 py-2">
              <option value="ethereum">Ethereum</option>
              <option value="solana">Solana</option>
              <option value="base">Base</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-sm mb-1">Price (ETH)</label>
          <input type="number" step="0.0001" min="0.0001" id="editPrice" required class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div class="mb-4">
          <label class="block text-sm mb-1">Description</label>
          <textarea id="editDescription" rows="3" class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
        </div>
        <div class="mb-6">
          <label class="block text-sm mb-1">Contact Info</label>
          <input type="text" id="editContact" required class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div class="flex justify-end gap-4">
          <button type="button" id="closeEditModal" class="px-6 py-2 bg-gray-600 rounded-lg hover:bg-gray-500">Cancel</button>
          <button type="submit" class="px-6 py-2 bg-purple-600 rounded-lg hover:bg-purple-700">Update</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="bg-gray-900 border-t border-gray-800 py-6 text-center text-sm text-gray-500">
    <p>Web3 Accounts & Digital Goods Marketplace Demo. Powered by Firebase & Ethers.js.</p>
  </footer>

  <script type="module">
    const { ethers } = window.ethers;
    const { 
      initializeApp, getDatabase, ref, onValue, push, set, update, remove, serverTimestamp,
      getAuth, signInWithPopup, GoogleAuthProvider, TwitterAuthProvider, signOut, onAuthStateChanged 
    } = window.firebaseModules;

    // Firebase Config Updated
    const firebaseConfig = {
      apiKey: "AIzaSyCvMzAs3etL30t9-hZa-jVPDTQQorq0ouU",
      authDomain: "ptptt-pcpc.firebaseapp.com",
      databaseURL: "https://ptptt-pcpc-default-rtdb.firebaseio.com",
      projectId: "ptptt-pcpc",
      storageBucket: "ptptt-pcpc.firebasestorage.app",
      messagingSenderId: "334612619008",
      appId: "1:334612619008:web:d1be8c95ef784f24335de5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // Elements
    const loginBtn = document.getElementById('loginBtn');
    const connectBtn = document.getElementById('connectBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const postBtn = document.getElementById('postBtn');
    const userInfo = document.getElementById('userInfo');
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userAddressEl = document.getElementById('userAddress');
    
    const marketplace = document.getElementById('marketplace');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const notConnected = document.getElementById('notConnected');

    const loginModal = document.getElementById('loginModal');
    const loginGoogleBtn = document.getElementById('loginGoogleBtn');
    const loginTwitterBtn = document.getElementById('loginTwitterBtn');
    const closeLoginModal = document.getElementById('closeLoginModal');

    const postModal = document.getElementById('postModal');
    const postForm = document.getElementById('postForm');
    const closePostModal = document.getElementById('closePostModal');

    const detailModal = document.getElementById('detailModal');
    const closeDetailModal = document.getElementById('closeDetailModal');
    const buyBtn = document.getElementById('buyBtn');
    const editBtn = document.getElementById('editBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const detailTitle = document.getElementById('detailTitle');
    const detailType = document.getElementById('detailType');
    const detailChain = document.getElementById('detailChain');
    const detailDescription = document.getElementById('detailDescription');
    const detailPrice = document.getElementById('detailPrice');
    const detailContact = document.getElementById('detailContact');
    const detailSeller = document.getElementById('detailSeller');
    const detailTime = document.getElementById('detailTime');

    const editModal = document.getElementById('editModal');
    const editForm = document.getElementById('editForm');
    const closeEditModal = document.getElementById('closeEditModal');
    const editId = document.getElementById('editId');
    const editTitle = document.getElementById('editTitle');
    const editType = document.getElementById('editType');
    const editChain = document.getElementById('editChain');
    const editPrice = document.getElementById('editPrice');
    const editDescription = document.getElementById('editDescription');
    const editContact = document.getElementById('editContact');

    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const filterAll = document.getElementById('filterAll');
    const filterAccount = document.getElementById('filterAccount');
    const filterDomain = document.getElementById('filterDomain');
    const filterOther = document.getElementById('filterOther');
    const sortNewest = document.getElementById('sortNewest');
    const sortPriceAsc = document.getElementById('sortPriceAsc');
    const sortPriceDesc = document.getElementById('sortPriceDesc');

    let currentUser = null;
    let walletAddress = null;
    let allItems = [];
    let currentFilter = 'all';
    let currentSort = 'newest';
    let currentSearch = '';
    let selectedItem = null;

    // Helper functions
    function timeAgo(timestamp) {
      if (!timestamp) return 'Unknown';
      const now = Date.now();
      const diff = now - timestamp;
      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' min ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' hr ago';
      return new Date(timestamp).toLocaleDateString();
    }

    function getActiveSellerId() {
      if (currentUser) return currentUser.uid;
      if (walletAddress) return walletAddress.toLowerCase();
      return null;
    }

    function updateAuthUI() {
      const activeId = getActiveSellerId();
      if (activeId) {
        postBtn.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        notConnected.classList.add('hidden');
      } else {
        postBtn.classList.add('hidden');
        logoutBtn.classList.add('hidden');
        notConnected.classList.remove('hidden');
      }

      if (currentUser) {
        userName.textContent = currentUser.displayName || currentUser.email || 'User';
        userAvatar.src = currentUser.photoURL || 'https://via.placeholder.com/150';
        userInfo.classList.remove('hidden');
        loginBtn.classList.add('hidden');
      } else {
        userInfo.classList.add('hidden');
        loginBtn.classList.remove('hidden');
      }

      if (walletAddress) {
        userAddressEl.textContent = walletAddress.slice(0,6) + "..." + walletAddress.slice(-4);
        userAddressEl.classList.remove('hidden');
        connectBtn.textContent = "Wallet Connected";
        connectBtn.classList.replace('bg-purple-600', 'bg-green-600');
      } else {
        userAddressEl.classList.add('hidden');
        connectBtn.textContent = "Connect Wallet";
        connectBtn.classList.replace('bg-green-600', 'bg-purple-600');
      }
    }

    // Firebase Auth Handlers
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      updateAuthUI();
    });

    loginBtn.onclick = () => loginModal.classList.remove('hidden');
    closeLoginModal.onclick = () => loginModal.classList.add('hidden');
    loginModal.onclick = e => { if (e.target === loginModal) loginModal.classList.add('hidden'); };

    loginGoogleBtn.onclick = async () => {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
        loginModal.classList.add('hidden');
      } catch (err) {
        alert("Google Login Error: " + err.message);
      }
    };

    loginTwitterBtn.onclick = async () => {
      try {
        const provider = new TwitterAuthProvider();
        await signInWithPopup(auth, provider);
        loginModal.classList.add('hidden');
      } catch (err) {
        alert("X (Twitter) Login Error: " + err.message);
      }
    };

    // Web3 Wallet Connection
    async function connectWallet() {
      if (!window.ethereum) return alert("Please install MetaMask or a Web3 Wallet!");
      try {
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = await provider.getSigner();
        walletAddress = await signer.getAddress();
        updateAuthUI();
      } catch (err) {
        alert("Wallet Connection Error: " + err.message);
      }
    }
    connectBtn.onclick = connectWallet;

    logoutBtn.onclick = async () => {
      await signOut(auth);
      walletAddress = null;
      updateAuthUI();
    };

    // Marketplace Realtime Listener
    function listenToMarketplace() {
      loadingState.classList.remove('hidden');
      emptyState.classList.add('hidden');

      const itemsRef = ref(db, 'items');
      onValue(itemsRef, (snapshot) => {
        allItems = [];
        snapshot.forEach(child => {
          const item = child.val();
          item.id = child.key;
          if (item.createdAt && item.status !== 'sold') allItems.push(item);
        });

        allItems.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        updateDisplay();
        loadingState.classList.add('hidden');
      }, (err) => {
        console.error(err);
        marketplace.innerHTML = '<p class="col-span-full text-center py-20 text-red-400">Error loading marketplace data</p>';
      });
    }

    function updateDisplay() {
      let displayed = [...allItems];

      if (currentFilter !== 'all') {
        displayed = displayed.filter(item => item.type === currentFilter);
      }

      if (currentSearch) {
        const term = currentSearch.toLowerCase();
        displayed = displayed.filter(item =>
          (item.title || '').toLowerCase().includes(term) ||
          (item.description || '').toLowerCase().includes(term)
        );
      }

      if (currentSort === 'priceAsc') {
        displayed.sort((a, b) => (a.price || 0) - (b.price || 0));
      } else if (currentSort === 'priceDesc') {
        displayed.sort((a, b) => (b.price || 0) - (a.price || 0));
      }

      renderItems(displayed);
    }

    function renderItems(items) {
      marketplace.innerHTML = '';
      if (items.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      const fragment = document.createDocumentFragment();
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-gray-800 rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition hover:-translate-y-1 duration-200 cursor-pointer flex flex-col justify-between';
        
        const icon = item.type === 'domain' ? '🌐' : item.type === 'account' ? '🔑' : '📦';

        card.innerHTML = `
          <div>
            <div class="h-40 bg-gradient-to-br from-purple-900 to-indigo-900 flex items-center justify-center text-5xl relative">
              ${icon}
              <span class="absolute top-2 right-2 text-xs bg-gray-900 px-2 py-1 rounded-full uppercase font-mono">${item.chain || 'ETH'}</span>
            </div>
            <div class="p-5">
              <h3 class="text-lg font-semibold mb-2 truncate">${item.title || 'Untitled Listing'}</h3>
              <p class="text-sm text-gray-400 mb-4 line-clamp-2">${item.description || 'No description provided'}</p>
            </div>
          </div>
          <div class="px-5 pb-5">
            <div class="flex justify-between items-center mb-3">
              <span class="text-xl font-bold text-green-400">${Number(item.price || 0).toFixed(4)} ETH</span>
              <button class="bg-purple-600 hover:bg-purple-700 px-4 py-1.5 rounded-lg text-xs font-medium">Details</button>
            </div>
            <div class="flex justify-between items-center text-xs text-gray-500 border-t border-gray-700/50 pt-3">
              <span>By: ${item.sellerName || (item.seller ? item.seller.slice(0,6)+'...' : 'Anonymous')}</span>
              <span>${timeAgo(item.createdAt)}</span>
            </div>
          </div>
        `;
        card.onclick = () => showDetail(item);
        fragment.appendChild(card);
      });
      marketplace.appendChild(fragment);
    }

    // Modal Operations
    postBtn.onclick = () => {
      if (getActiveSellerId()) postModal.classList.remove('hidden');
      else alert("Please login or connect wallet to post items!");
    };
    closePostModal.onclick = () => postModal.classList.add('hidden');
    postModal.onclick = e => { if (e.target === postModal) postModal.classList.add('hidden'); };

    postForm.onsubmit = async e => {
      e.preventDefault();
      const sellerId = getActiveSellerId();
      if (!sellerId) return;

      const title = document.getElementById('title').value.trim();
      const type = document.getElementById('type').value;
      const chain = document.getElementById('chain').value;
      const price = parseFloat(document.getElementById('price').value);
      const description = document.getElementById('description').value.trim();
      const contact = document.getElementById('contact').value.trim();

      if (!title || isNaN(price) || price <= 0 || !contact) return alert("Please complete all required fields correctly.");

      try {
        const newRef = push(ref(db, 'items'));
        await set(newRef, {
          title, type, chain, price, description, contact,
          seller: sellerId,
          sellerName: currentUser ? (currentUser.displayName || currentUser.email) : walletAddress.slice(0,6)+'...',
          status: 'available',
          createdAt: serverTimestamp()
        });
        alert("Listing published successfully!");
        postForm.reset();
        postModal.classList.add('hidden');
      } catch (err) {
        alert("Failed to post: " + err.message);
      }
    };

    function showDetail(item) {
      selectedItem = item;
      detailTitle.textContent = item.title || 'Untitled';
      detailType.textContent = `Type: ${item.type.toUpperCase()}`;
      detailChain.textContent = `Chain: ${item.chain.toUpperCase()}`;
      detailDescription.textContent = item.description || 'No description provided';
      detailPrice.textContent = `${Number(item.price || 0).toFixed(4)} ETH`;
      detailContact.textContent = `Contact Seller: ${item.contact || 'N/A'}`;
      detailSeller.textContent = `Seller ID/Name: ${item.sellerName || item.seller}`;
      detailTime.textContent = `Posted: ${timeAgo(item.createdAt)}`;

      const currentSellerId = getActiveSellerId();
      const isOwner = currentSellerId && (currentSellerId === item.seller || currentSellerId.toLowerCase() === item.seller.toLowerCase());

      buyBtn.classList.toggle('hidden', isOwner);
      editBtn.classList.toggle('hidden', !isOwner);
      deleteBtn.classList.toggle('hidden', !isOwner);

      detailModal.classList.remove('hidden');
    }

    closeDetailModal.onclick = () => detailModal.classList.add('hidden');
    detailModal.onclick = e => { if (e.target === detailModal) detailModal.classList.add('hidden'); };

    buyBtn.onclick = async () => {
      if (!walletAddress) return alert("Please connect Web3 wallet (MetaMask) to make payments.");
      if (!selectedItem) return;

      try {
        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();
        
        // If seller is a wallet address, pay directly; otherwise process transaction
        const recipient = selectedItem.seller.startsWith('0x') ? selectedItem.seller : walletAddress;

        const tx = await signer.sendTransaction({
          to: recipient,
          value: ethers.parseEther(selectedItem.price.toString())
        });
        
        await tx.wait();

        await update(ref(db, `items/${selectedItem.id}`), {
          status: 'sold',
          buyer: walletAddress,
          soldAt: serverTimestamp()
        });

        alert("Transaction successful! Tx Hash: " + tx.hash);
        detailModal.classList.add('hidden');
      } catch (err) {
        alert("Payment failed: " + err.message);
      }
    };

    // Edit Item
    editBtn.onclick = () => {
      if (!selectedItem) return;

      editId.value = selectedItem.id;
      editTitle.value = selectedItem.title || '';
      editType.value = selectedItem.type || 'account';
      editChain.value = selectedItem.chain || 'ethereum';
      editPrice.value = selectedItem.price || 0;
      editDescription.value = selectedItem.description || '';
      editContact.value = selectedItem.contact || '';

      detailModal.classList.add('hidden');
      editModal.classList.remove('hidden');
    };

    closeEditModal.onclick = () => editModal.classList.add('hidden');
    editModal.onclick = e => { if (e.target === editModal) editModal.classList.add('hidden'); };

    editForm.onsubmit = async e => {
      e.preventDefault();
      const id = editId.value;
      if (!id) return;

      try {
        await update(ref(db, `items/${id}`), {
          title: editTitle.value.trim(),
          type: editType.value,
          chain: editChain.value,
          price: parseFloat(editPrice.value),
          description: editDescription.value.trim(),
          contact: editContact.value.trim(),
          updatedAt: serverTimestamp()
        });
        alert("Listing updated!");
        editModal.classList.add('hidden');
      } catch (err) {
        alert("Update error: " + err.message);
      }
    };

    // Delete Item
    deleteBtn.onclick = async () => {
      if (!selectedItem || !confirm("Are you sure you want to delete this listing?")) return;
      try {
        await remove(ref(db, `items/${selectedItem.id}`));
        alert("Listing deleted.");
        detailModal.classList.add('hidden');
      } catch (err) {
        alert("Delete failed: " + err.message);
      }
    };

    // Filtering & Sorting
    function updateFilter(filter, btn) {
      currentFilter = filter;
      [filterAll, filterAccount, filterDomain, filterOther].forEach(b => b.classList.remove('filter-active'));
      btn.classList.add('filter-active');
      updateDisplay();
    }
    filterAll.onclick = () => updateFilter('all', filterAll);
    filterAccount.onclick = () => updateFilter('account', filterAccount);
    filterDomain.onclick = () => updateFilter('domain', filterDomain);
    filterOther.onclick = () => updateFilter('other', filterOther);

    function updateSort(sort, btn) {
      currentSort = sort;
      [sortNewest, sortPriceAsc, sortPriceDesc].forEach(b => b.classList.remove('filter-active'));
      btn.classList.add('filter-active');
      updateDisplay();
    }
    sortNewest.onclick = () => updateSort('newest', sortNewest);
    sortPriceAsc.onclick = () => updateSort('priceAsc', sortPriceAsc);
    sortPriceDesc.onclick = () => updateSort('priceDesc', sortPriceDesc);

    searchBtn.onclick = () => {
      currentSearch = searchInput.value.trim();
      updateDisplay();
    };
    searchInput.addEventListener('input', () => {
      currentSearch = searchInput.value.trim();
      updateDisplay();
    });

    // Start App
    listenToMarketplace();
  </script>
</body>
</html>
